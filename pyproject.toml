# pyproject.toml
[project]
name = "hedge-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2", "ranx", "pyyaml", "pydantic", "pytest", "torch"]

[tool.uv]
environments = ["sys_platform == 'linux'"]   # only resolve for Linux

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }